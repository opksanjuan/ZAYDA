<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>ZAYDA – Gestión</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Allura&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f8f4ee;--card:#fffdf9;--tx:#3a2f2f;--mu:#7a6e69;--pr:#96545b;--prt:#fff;--sg:#9a9b82;--ok:#5a7a4c;--ma:#b0383a;--bd:#e4dccf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#211d1e;--card:#2c2627;--tx:#f4ece6;--mu:#b9ada5;--pr:#dba3a7;--prt:#2e1a1c;--sg:#b3b49a;--ok:#9fc48e;--ma:#ff9a95;--bd:#443b3c}}
:root[data-theme="dark"]{--bg:#211d1e;--card:#2c2627;--tx:#f4ece6;--mu:#b9ada5;--pr:#dba3a7;--prt:#2e1a1c;--sg:#b3b49a;--ok:#9fc48e;--ma:#ff9a95;--bd:#443b3c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.4 Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
main{max-width:720px;margin:0 auto;padding:14px}
h2{font:700 26px/1.2 "Cormorant Garamond",Georgia,serif;color:var(--pr);margin:20px 0 8px}.hd{display:flex;align-items:center;gap:14px;padding:6px 2px 12px;border-bottom:2px solid var(--sg);margin-bottom:6px}.hd img{width:72px;height:72px;border-radius:50%;flex:none}.hd .nm{font:700 42px/1 "Cormorant Garamond",Georgia,serif;color:var(--pr);letter-spacing:2px}.hd .sb{font-size:12px;letter-spacing:4px;font-weight:600;margin-top:4px}.hd .sc{font:26px/1 Allura,cursive;color:var(--sg);margin-top:2px}h3{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 1px 0 var(--bd)}
.big{font:700 34px/1.1 "Cormorant Garamond",Georgia,serif}.mu{color:var(--mu);font-size:15px}.ok{color:var(--ok)}.ma{color:var(--ma)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:12px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.b{font:inherit;font-weight:700;padding:13px 18px;border:0;border-radius:12px;background:var(--pr);color:var(--prt);cursor:pointer;min-height:48px}
.b.sec{background:transparent;color:var(--pr);border:2px solid var(--pr)}.foot{text-align:center;margin:26px 0 4px;color:var(--sg);font:28px Allura,cursive}.b.red{background:var(--ma);color:#fff}.b.sm{padding:8px 12px;min-height:40px;font-size:16px}
.b.full{width:100%;margin-top:12px}.row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:13px;padding:2px 8px;border-radius:99px;background:var(--sg);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:8px 1px;cursor:pointer}
nav button span{display:block;font-size:24px}nav button.on{color:var(--pr);font-weight:700}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.dn{font-size:13px;color:var(--mu);font-weight:700;padding:4px 0}
.cd{border:0;background:var(--bg);color:var(--tx);font:inherit;font-size:17px;border-radius:10px;aspect-ratio:1;cursor:pointer;padding:0}.cd.fe{background:var(--pr);color:var(--prt);font-weight:700}.cd.hoy{outline:3px solid var(--sg)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.mh b{font:700 24px "Cormorant Garamond",Georgia,serif;color:var(--pr)}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mu);font-size:13px}.n{text-align:right!important;white-space:nowrap}.tw{overflow-x:auto}tfoot td{font-weight:700;border-top:2px solid var(--sg)}
@media print{nav,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.card{border:0;box-shadow:none;padding:0}:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#555}}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:9;overflow:auto}
.mb{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:440px}
#fl{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:12px;display:none;z-index:10;max-width:92%}
</style></head><body>

function addCart(){
  const p=S.productos.find(x=>x.id===V.pid);if(!p)return flash('Elegí un producto');
  const ya=V.cart.filter(i=>i.pid===p.id).reduce((a,i)=>a+i.cant,0);
  if(ya+V.cant>p.stock)return flash('No alcanza el stock: quedan '+p.stock);
  const e=V.cart.find(i=>i.pid===p.id);if(e)e.cant+=V.cant;else V.cart.push({pid:p.id,nombre:prodN(p),cant:V.cant,precio:p.precio});
  V.cant=1;V.pid='';render();
}
function regVenta(){
  const tot=V.cart.reduce((a,i)=>a+i.cant*i.precio,0);
  const medio=$('#vm').value;const pago=V.pago===''?tot:(parseFloat(String(V.pago).replace(',','.'))||0);
  if(pago>tot)return flash('Lo pagado es mayor al total');
  if(pago<tot&&!V.cli)return flash('Para dejar deuda elegí un comprador');
  V.cart.forEach(i=>{const p=S.productos.find(x=>x.id===i.pid);if(p)p.stock-=i.cant});
  S.ventas.push({id:uid(),fecha:hoy(),items:V.cart.map(i=>({...i})),total:tot,cli:V.cli,pagos:pago>0?[{fecha:hoy(),monto:pago,medio}]:[]});
  V={pid:'',cant:1,cli:'',medio:'',pago:'',cart:[]};save();render();flash('¡Venta registrada! 🎉');
}
function delVenta(id){modal('¿Anular esta venta?','<p>Se devuelven los productos al stock.</p>',()=>{const v=S.ventas.find(x=>x.id===id);v.items.forEach(i=>{const p=S.productos.find(x=>x.id===i.pid);if(p)p.stock+=i.cant});S.ventas=S.ventas.filter(x=>x.id!==id);save();render()},'Sí, anular')}

async function exportar(){
  let dl=null;
  if(!dl)dl={save:async({filename,data})=>bajar(filename,data instanceof Blob?data:new Blob([data]))};
  if(!window.XLSX)return flash('No cargó el módulo de Excel. Probá de nuevo.');
  const sm=(a,f)=>a.reduce((x,y)=>x+f(y),0);
  const tipoDe=i=>{const p=S.productos.find(x=>x.id===i.pid);return p?p.tipo:'(producto borrado)'};
  const mk=(rows,tot)=>{const r=rows.length?rows.slice():[{'(sin datos)':''}];if(rows.length&&tot)r.push(tot);const ws=XLSX.utils.json_to_sheet(r);const ks=Object.keys(r[0]);ws['!cols']=ks.map(k=>({wch:Math.min(45,Math.max(k.length,...r.map(o=>String(o[k]==null?'':o[k]).length))+2)}));return ws};
  const gv={};
  S.productos.forEach(p=>gv[p.id]={Producto:prodN(p),Tipo:p.tipo,'Unidades vendidas':0,'Total vendido':0,'Stock actual':p.stock});
  S.ventas.forEach(v=>v.items.forEach(i=>{const k=i.pid&&gv[i.pid]?i.pid:i.nombre;const g=gv[k]||(gv[k]={Producto:i.nombre,Tipo:tipoDe(i),'Unidades vendidas':0,'Total vendido':0,'Stock actual':'-'});g['Unidades vendidas']+=i.cant;g['Total vendido']+=i.cant*i.precio}));
  const pv=Object.values(gv).sort((x,y)=>y['Unidades vendidas']-x['Unidades vendidas']);
  const uni=sm(pv,g=>g['Unidades vendidas']),totV=sm(S.ventas,v=>v.total);
  const uTipo=t=>sm(pv.filter(g=>g.Tipo===t),g=>g['Unidades vendidas']);
  const vent=[];S.ventas.forEach(v=>v.items.forEach(i=>vent.push({Fecha:fmtF(v.fecha),Comprador:cliN(v.cli),Producto:i.nombre,Tipo:tipoDe(i),Cantidad:i.cant,'Precio unit.':i.precio,Subtotal:i.cant*i.precio,'Total de la venta':v.total,Pagado:pagado(v),Debe:saldo(v),'Medio de pago':v.pagos.map(p=>p.medio).join(' + ')})));
  const gas=S.gastos.slice().sort((x,y)=>x.fecha.localeCompare(y.fecha)).map(g=>({Fecha:fmtF(g.fecha),Concepto:g.concepto,Monto:g.monto,'Medio de pago':g.medio}));
  const gc={};S.gastos.forEach(g=>{const k=g.concepto.trim().toUpperCase();const o=gc[k]||(gc[k]={'En qué se gastó':k,'Cantidad de gastos':0,'Total gastado':0});o['Cantidad de gastos']++;o['Total gastado']+=g.monto});
  const gcr=Object.values(gc).sort((x,y)=>y['Total gastado']-x['Total gastado']);
  const totG=sm(S.gastos,g=>g.monto);
  const deu=S.ventas.filter(v=>saldo(v)>0).map(v=>({Comprador:cliN(v.cli),Fecha:fmtF(v.fecha),Detalle:v.items.map(i=>i.cant+'× '+i.nombre).join(', '),Total:v.total,Pagado:pagado(v),Debe:saldo(v)}));
  const totD=sm(S.ventas,v=>saldo(v));
  const encs=S.encargos||[];const med={};S.ventas.concat(encs).forEach(v=>v.pagos.forEach(p=>{med[p.medio]=(med[p.medio]||0)+p.monto}));
  const medr=Object.keys(med).map(k=>({'Medio de pago':k,'Ingresos cobrados':med[k]}));
  const ing=sm(S.ventas,pagado)+sm(encs,pagado);
  const res=[{Concepto:'INGRESOS',Valor:''},{Concepto:'Total vendido',Valor:totV},{Concepto:'Ingresos cobrados',Valor:ing},{Concepto:'Pendiente de cobro (deudores)',Valor:totD},{Concepto:'',Valor:''},
   {Concepto:'GASTOS',Valor:''},{Concepto:'Total gastado',Valor:totG},{Concepto:'',Valor:''},
   {Concepto:'GANANCIA / BALANCE (cobrado − gastado)',Valor:ing-totG},{Concepto:'',Valor:''},
   {Concepto:'VENTAS',Valor:''},{Concepto:'Cantidad de ventas',Valor:S.ventas.length},{Concepto:'Almohadones vendidos (unidades)',Valor:uTipo('Almohadón decorativo')},{Concepto:'Almohaditas terapéuticas vendidas (unidades)',Valor:uTipo('Almohadita terapéutica')},{Concepto:'Total de unidades vendidas',Valor:uni},{Concepto:'',Valor:''},
   {Concepto:'DEUDORES',Valor:''},{Concepto:'Cantidad de deudas pendientes',Valor:deu.length},{Concepto:'',Valor:''},{Concepto:'ENCARGOS PENDIENTES',Valor:''},{Concepto:'Cantidad de encargos',Valor:encs.length},{Concepto:'Señas cobradas',Valor:sm(encs,pagado)},{Concepto:'Falta cobrar al entregar',Valor:sm(encs,saldo)}];
  const wb=XLSX.utils.book_new();
  const rs=mk(res);rs['!cols']=[{wch:48},{wch:16}];
  XLSX.utils.book_append_sheet(wb,rs,'Resumen');
  XLSX.utils.book_append_sheet(wb,mk(pv,{Producto:'TOTAL',Tipo:'','Unidades vendidas':uni,'Total vendido':sm(pv,g=>g['Total vendido']),'Stock actual':''}),'Vendidos por producto');

  XLSX.utils.book_append_sheet(wb,mk(mr,{Mes:'TOTAL','Ingresos cobrados':ing,Gastos:totG,Ganancia:ing-totG}),'Ganancias por mes');

  XLSX.utils.book_append_sheet(wb,mk(S.productos.map(p=>({Producto:prodN(p),Tipo:p.tipo,Stock:p.stock,Precio:p.precio,'Valor en stock':p.stock*p.precio})),{Producto:'TOTAL',Tipo:'',Stock:sm(S.productos,p=>p.stock),Precio:'','Valor en stock':sm(S.productos,p=>p.stock*p.precio)}),'Stock');
  XLSX.utils.book_append_sheet(wb,mk(medr,{'Medio de pago':'TOTAL','Ingresos cobrados':ing}),'Cobros por medio');
  const MON=new Set(['Precio unit.','Subtotal','Total de la venta','Pagado','Debe','Monto','Total','Total vendido','Ingresos cobrados','Gastos','Ganancia','Total gastado','Valor','Costo por unidad','Costo total','Ganancia estimada','Seña pagada','Falta','Precio','Valor en stock']);

let E={pid:'',cant:1,cli:'',medio:'',sena:'',total:'',nota:'',ent:'',cart:[]};

const r05=x=>Math.ceil(x*2)/2;
function calcSug(p){
  const mg=S.margen==null?50:S.margen,totG=S.gastos.reduce((a,g)=>a+g.monto,0);
  const vend={};S.ventas.forEach(v=>v.items.forEach(i=>{vend[i.pid]=(vend[i.pid]||0)+i.cant}));
  const uds=q=>(vend[q.id]||0)+Math.max(0,q.stock);
  const W=S.productos.reduce((a,q)=>a+q.precio*uds(q),0);
  const propio=p.costo>0,base=propio?p.costo:(W>0?totG*p.precio/W:0);
  return{base,propio,sug:base>0?r05(base*(1+mg/100)):0,mg,totG};
}
function sugerido(){
  const mg=S.margen==null?50:S.margen,totG=S.gastos.reduce((a,g)=>a+g.monto,0);

  ${S.productos.length?S.productos.map(p=>{const c=calcSug(p);const ok=c.sug>0&&p.precio>=c.sug;return `<div class="card"><div class="item" style="border:0;padding:0"><span><b>${esc(prodN(p))}</b><br><span class="mu">Costo ${c.base>0?$$(Math.round(c.base*100)/100)+(c.propio?' (cargado)':' (estimado)'):'sin datos'}<br>Precio actual: ${$$(p.precio)}</span></span><span style="text-align:right">${c.sug>0?`<div class="mu">Sugerido</div><div class="big ${ok?'ok':'ma'}">${$$(c.sug)}</div>`:'<span class="mu">Anotá gastos o el costo</span>'}</span></div>
  ${c.sug>0?`<div style="margin-top:8px">${ok?'✅ Tu precio actual cubre costo y ganancia':'⚠️ Conviene subir el precio'}</div>`:''}
  <button class="b sm sec" style="margin-top:10px" onclick="formCosto('${p.id}')">${p.costo>0?'Cambiar costo':'Cargar costo'}</button></div>`}).join(''):'<div class="card mu">Primero cargá productos en Stock.</div>'}`;
}

function bajar(nombre,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}

function cargarCopia(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){return flash('El archivo no es válido')}

function resumenV(){
  const VV=S.ventas.slice().reverse().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const tV=S.ventas.reduce((a,v)=>a+v.total,0),tP=S.ventas.reduce((a,v)=>a+pagado(v),0);
  const tab_=(h,rows,foot)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th class="${x[1]?'n':''}">${x[0]}</th>`).join('')}</tr></thead><tbody>${rows}</tbody>${foot?`<tfoot><tr>${foot}</tr></tfoot>`:''}</table></div>`;
  const cr=S.clientes.map(c=>{const vs=S.ventas.filter(v=>v.cli===c.id);return{c,t:vs.reduce((a,v)=>a+v.total,0),p:vs.reduce((a,v)=>a+pagado(v),0),n:vs.length}});
  const uT=S.productos.reduce((a,p)=>a+p.stock,0),vT=S.productos.reduce((a,p)=>a+p.stock*p.precio,0);
  return `<div class="row noprint"><button class="b sec" onclick="go('inicio')">← Volver</button><button class="b" onclick="window.print()">🖨 Imprimir</button></div>
  <h2>Ventas realizadas</h2><div class="card">${S.ventas.length?tab_([['Fecha'],['Comprador'],['Producto'],['Total',1],['Pagó',1],['Debe',1]],VV.map(v=>`<tr><td>${fmtF(v.fecha).slice(0,5)}</td><td>${esc(cliN(v.cli))}</td><td>${v.items.map(i=>i.cant+'× '+esc(i.nombre)).join('<br>')}</td><td class="n">${$$(v.total)}</td><td class="n">${$$(pagado(v))}</td><td class="n ${saldo(v)>0?'ma':''}">${saldo(v)>0?$$(saldo(v)):'—'}</td></tr>`).join(''),`<td colspan="3">TOTAL (${S.ventas.length} ventas)</td><td class="n">${$$(tV)}</td><td class="n">${$$(tP)}</td><td class="n ma">${$$(tV-tP)}</td>`):'<span class="mu">Todavía no hay ventas.</span>'}</div>
  <h2>Compradores</h2><div class="card">${cr.length?tab_([['Nombre'],['Compras',1],['Compró',1],['Debe',1]],cr.map(r=>`<tr><td>${esc(r.c.nombre)}${r.c.tel?'<br><span class="mu">'+esc(r.c.tel)+'</span>':''}</td><td class="n">${r.n}</td><td class="n">${$$(r.t)}</td><td class="n ${r.t-r.p>0?'ma':''}">${r.t-r.p>0?$$(r.t-r.p):'—'}</td></tr>`).join('')):'<span class="mu">Sin compradores.</span>'}</div>
  <h2>Stock</h2><div class="card">${S.productos.length?tab_([['Producto'],['Stock',1],['Precio',1],['Valor',1]],S.productos.map(p=>`<tr><td>${esc(prodN(p))}</td><td class="n ${p.stock<=2?'ma':''}"><b>${p.stock}</b></td><td class="n">${$$(p.precio)}</td><td class="n">${$$(p.stock*p.precio)}</td></tr>`).join(''),`<td>TOTAL</td><td class="n">${uT}</td><td></td><td class="n">${$$(vT)}</td>`):'<span class="mu">Sin productos.</span>'}</div>`;
}
render();init();
</script></body></html>
